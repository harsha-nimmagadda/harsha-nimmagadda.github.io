
      <!-- ===================================================================== -->
      <!-- MODAL: Question Detail Modal with Prev/Next Navigation -->
      <!-- ===================================================================== -->
      <div id="exam-question-detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden backdrop-blur-xs">
        <div class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl space-y-4">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-2.5">
              <span class="px-2.5 py-1 rounded-full bg-primary/10 text-primary font-mono font-bold text-xs" id="qmodal-num">Q1</span>
              <span class="text-xs font-semibold text-slate-700" id="qmodal-subject">Physics</span>
              <span class="text-xs text-muted">&bull;</span>
              <span class="text-xs text-muted" id="qmodal-topic">Rotational Dynamics</span>
              <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase" id="qmodal-diff">Hard</span>
            </div>
            <button onclick="closeExamQuestionDetailModal()" class="h-8 w-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-muted hover:text-slate-900 transition-colors">
              <i class="ph-bold ph-x text-base"></i>
            </button>
          </div>

          <!-- Question Stem -->
          <div class="p-4 rounded-xl bg-slate-50 border border-border text-sm text-gray-900 leading-relaxed font-sans" id="qmodal-stem"></div>

          <!-- Options -->
          <div class="space-y-2" id="qmodal-options"></div>

          <!-- Solution & Explanation -->
          <div class="p-4 rounded-xl bg-emerald-50/50 border border-emerald-200 space-y-1.5">
            <p class="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
              <i class="ph-bold ph-check-circle"></i> Complete Solution & Explanation:
            </p>
            <div class="text-xs text-slate-800 leading-relaxed font-sans" id="qmodal-solution"></div>
          </div>

          <!-- Modal Footer with Prev / Next -->
          <div class="flex items-center justify-between pt-2 border-t border-border">
            <button onclick="navigateExamQuestionModal(-1)" id="qmodal-prev-btn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-border text-xs font-medium text-muted hover:text-slate-900 hover:bg-slate-50 transition-colors">
              <i class="ph-bold ph-caret-left"></i> Previous
            </button>
            <span class="text-xs font-mono text-muted" id="qmodal-counter">Question 1 of 75</span>
            <button onclick="navigateExamQuestionModal(1)" id="qmodal-next-btn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-border text-xs font-medium text-muted hover:text-slate-900 hover:bg-slate-50 transition-colors">
              Next <i class="ph-bold ph-caret-right"></i>
            </button>
          </div>
        </div>
      </div>
